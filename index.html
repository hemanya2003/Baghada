<!DOCTYPE html>
<html>
<head>
    <title>Baghada Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        #map { height: 100vh; }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Map
var map = L.map('map').setView([22.0, 87.0], 14);

// Google Satellite
L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
    subdomains:['mt0','mt1','mt2','mt3'],
    maxZoom: 20
}).addTo(map);

// Load your GeoJSON
fetch('https://raw.githubusercontent.com/hemanya2003/Baghada/main/Near_Baghda.json')
.then(res => res.json())
.then(data => {

    let geoLayer = L.geoJSON(data, {

        style: {
            color: "red",
            weight: 1,
            fillOpacity: 0
        },

        onEachFeature: function(feature, layer) {

            let desc = feature.properties.description?.value || "";

            let plot = "N/A";
            let village = "N/A";

            // 🔥 Extract values
            let plotMatch = desc.match(/PLOT_NO<\/B>\s*=\s*(\d+)/);
            let villageMatch = desc.match(/VILL_NAME<\/B>\s*=\s*([^<]+)/);

            if (plotMatch) plot = plotMatch[1];
            if (villageMatch) village = villageMatch[1];

            layer.bindPopup(
                "<b>Village:</b> " + village + "<br>" +
                "<b>Plot No:</b> " + plot
            );
        }

    }).addTo(map);

    map.fitBounds(geoLayer.getBounds());

})
.catch(err => console.log(err));

</script>

</body>
</html>
